{% extends 'base.html' %}

{% block content %}

<div class="customer-page">

    <div class="page-header">
        <div>
            <h2>Add Customer</h2>
            <p>Create a new customer profile</p>
        </div>

        <a href="{% url 'customers' %}" class="back-btn">
            <i class="fa fa-arrow-left"></i>
            Back to Customers
        </a>
    </div>


    <div class="customer-form-card">

        <div class="form-section-header">
            <div class="section-icon">
                <i class="fa fa-user-plus"></i>
            </div>

            <div>
                <h3>Customer Information</h3>
                <p>Enter the customer's basic information</p>
            </div>
        </div>


        <form method="POST" class="customer-form">

            {% csrf_token %}


            <!-- Customer Information -->

            <div class="form-section-title">
                <i class="fa fa-user"></i>
                Customer Information
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label for="id_name">
                        Customer Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="name"
                        id="id_name"
                        class="form-control"
                        placeholder="Enter customer name"
                        required
                    >
                </div>


                <div class="form-group">

                    <label for="id_arabic_name">
                        Arabic Name
                    </label>

                    <input
                        type="text"
                        name="arabic_name"
                        id="id_arabic_name"
                        class="form-control arabic-input"
                        placeholder="أدخل اسم العميل"
                        dir="rtl"
                    >

                </div>


                <div class="form-group">

                    <label for="id_customer_type">
                        Customer Type
                        <span class="required">*</span>
                    </label>

                    <select
                        name="customer_type"
                        id="id_customer_type"
                        class="form-control"
                        required
                    >

                        <option value="">Select customer type</option>

                        <option value="B2B">
                            B2B — Business
                        </option>

                        <option value="B2C">
                            B2C — Individual
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="id_company">
                        Company
                    </label>

                    <input
                        type="text"
                        name="company"
                        id="id_company"
                        class="form-control"
                        placeholder="Enter company name"
                    >

                </div>

            </div>


            <!-- Contact Information -->

            <div class="form-section-title">

                <i class="fa fa-address-book"></i>

                Contact Information

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label for="id_phone">
                        Mobile Number
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="phone"
                        id="id_phone"
                        class="form-control"
                        placeholder="+966 5XXXXXXXX"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="id_email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        class="form-control"
                        placeholder="customer@example.com"
                    >

                </div>

            </div>


            <!-- Saudi Business Information -->

            <div class="form-section-title">

                <i class="fa fa-building"></i>

                Saudi Business Information

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label for="id_vat_number">
                        VAT Number
                    </label>

                    <input
                        type="text"
                        name="vat_number"
                        id="id_vat_number"
                        class="form-control"
                        placeholder="Enter VAT number"
                    >

                </div>


                <div class="form-group">

                    <label for="id_cr_number">
                        Commercial Registration (CR)
                    </label>

                    <input
                        type="text"
                        name="cr_number"
                        id="id_cr_number"
                        class="form-control"
                        placeholder="Enter CR number"
                    >

                </div>

            </div>


            <!-- Location -->

            <div class="form-section-title">

                <i class="fa fa-location-dot"></i>

                Location

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label for="id_city">
                        City
                    </label>

                    <input
                        type="text"
                        name="city"
                        id="id_city"
                        class="form-control"
                        placeholder="e.g. Jeddah"
                    >

                </div>


                <div class="form-group">

                    <label for="id_district">
                        District
                    </label>

                    <input
                        type="text"
                        name="district"
                        id="id_district"
                        class="form-control"
                        placeholder="e.g. Al Salamah"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="id_address">
                    Address
                </label>

                <textarea
                    name="address"
                    id="id_address"
                    class="form-control"
                    rows="4"
                    placeholder="Enter complete address"
                ></textarea>

            </div>


            <!-- Actions -->

            <div class="customer-form-actions">

                <a
                    href="{% url 'customers' %}"
                    class="customer-cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="customer-save-btn"
                >
                    <i class="fa fa-save"></i>
                    Save Customer
                </button>

            </div>


        </form>

    </div>

</div>

{% endblock %}
