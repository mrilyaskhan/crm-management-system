{% extends 'base.html' %}

{% block content %}

<div class="card-box">

    <div class="page-header">
        <h2>Customers 👥</h2>

        <a href="{% url 'add_customer' %}" class="btn btn-success">
            + Add Customer
        </a>
    </div>

    <table class="table table-hover mt-3">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Company</th>
                <th>Created</th>
            </tr>
        </thead>

        <tbody>
            {% for c in customers %}
            <tr>
               <td>
                    <a href="{% url 'customer_detail' c.id %}" class="record-link">
                        {{ c.name }}
                    </a>
                </td>
                </td>
                <td>{{ c.phone }}</td>
                <td>{{ c.email }}</td>
                <td>{{ c.company }}</td>
                <td>{{ c.created_at }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No customers yet</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
