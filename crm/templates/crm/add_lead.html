{% extends 'base.html' %}

{% block content %}

<div class="card-box">

    <div class="page-header">
        <h2>Add Lead 🔥</h2>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Name</label>
            {{ form.name }}
        </div>

        <div class="form-group">
            <label>Phone</label>
            {{ form.phone }}
        </div>

        <div class="form-group">
            <label>Email</label>
            {{ form.email }}
        </div>

        <div class="form-group">
            <label>Source</label>
            {{ form.source }}
        </div>

        <div class="form-group">
            <label>Status</label>
            {{ form.status }}
        </div>

        <div class="form-group">
            <label>Assigned To</label>
            {{ form.assigned_to }}
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">
            Save Lead
        </button>

    </form>

</div>

{% endblock %}
