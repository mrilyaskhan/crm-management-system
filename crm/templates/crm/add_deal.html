{% extends 'base.html' %}

{% block content %}

<div class="card-box">

    <div class="page-header">
        <h2>Add Deal 💰</h2>
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">
                <label>🏢 Customer</label>
                {{ form.customer }}
            </div>

            <div class="form-group">
                <label>📄 Deal Title</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label>💵 Amount</label>
                {{ form.amount }}
            </div>

            <div class="form-group">
                <label>📊 Stage</label>
                {{ form.stage }}
            </div>

            <div class="form-group">
                <label>📅 Expected Close Date</label>
                {{ form.expected_close_date }}
            </div>

        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">
            Save Deal
        </button>

    </form>

</div>

{% endblock %}
